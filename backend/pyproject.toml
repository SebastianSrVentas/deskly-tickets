[project]
name = "deskly-backend"
version = "0.1.0"
description = "API de tickets de soporte Deskly"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

# Es una aplicacion, no una libreria: uv no debe intentar instalarla como paquete.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
