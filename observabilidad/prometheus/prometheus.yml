global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: deskly-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: mongo
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
